<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBE CODING | 프리미엄 MBTI 정밀 분석</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --vibe-purple: #6C5CE7;
            --vibe-purple-light: #A29BFE;
            --vibe-blue: #0984E3;
            --vibe-pink: #FD79A8;
            --vibe-mint: #00B894;
            --vibe-dark: #2D3436;
            --vibe-light: #F9F9FB;
            --grad-main: linear-gradient(135deg, #6C5CE7 0%, #A29BFE 100%);
            --grad-accent: linear-gradient(135deg, #0984E3 0%, #74B9FF 100%);
            --shadow-soft: 0 15px 35px rgba(0,0,0,0.05);
            --shadow-premium: 0 20px 50px rgba(108, 92, 231, 0.15);
            --glass: rgba(255, 255, 255, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(120deg, #fdfbfb 0%, #ebedee 100%);
            color: var(--vibe-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            box-shadow: var(--shadow-premium);
            padding: 40px 25px;
            position: relative;
            min-height: 650px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .brand-logo {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 900;
            font-size: 0.85rem;
            letter-spacing: 3px;
            color: var(--vibe-purple);
            opacity: 0.6;
            text-transform: uppercase;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex: 1;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) both;
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Elements */
        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 12px;
            line-height: 1.4;
            color: var(--vibe-dark);
            word-break: keep-all;
            text-align: center;
        }

        .subtitle {
            font-size: 1rem;
            color: #636e72;
            margin-bottom: 35px;
            line-height: 1.6;
            text-align: center;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 20px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-main {
            background: var(--grad-main);
            color: white;
            box-shadow: 0 10px 25px rgba(108, 92, 231, 0.3);
            margin-top: 15px;
        }

        .btn-main:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 35px rgba(108, 92, 231, 0.4);
        }

        .answer-btn {
            background: #ffffff;
            color: var(--vibe-dark);
            border: 1px solid #E9ECEF;
            margin-bottom: 12px;
            text-align: left;
            line-height: 1.5;
            padding: 22px;
            justify-content: flex-start;
            font-weight: 500;
        }

        .answer-btn:hover {
            border-color: var(--vibe-purple);
            background: #F8F7FF;
            color: var(--vibe-purple);
            padding-left: 30px;
        }

        /* Navigation */
        .nav-btns {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 10px;
        }

        .btn-prev {
            width: 30%;
            background: #f1f2f6;
            color: #747d8c;
            padding: 15px;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            margin-bottom: 30px;
        }

        .progress-wrap {
            width: 100%;
            height: 6px;
            background: #EDF2F7;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--grad-main);
            transition: width 0.5s ease;
        }

        .question-meta {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--vibe-purple);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        /* Results Visualization */
        .result-header { text-align: center; margin-bottom: 30px; }
        .result-mbti {
            font-size: 4.5rem;
            font-weight: 900;
            background: var(--grad-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: -2px;
        }

        .result-nickname {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--vibe-purple);
            margin-bottom: 5px;
        }

        .trait-container {
            width: 100%;
            margin-bottom: 25px;
        }

        .trait-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .trait-bar-bg {
            height: 12px;
            background: #F1F3F5;
            border-radius: 10px;
            position: relative;
            display: flex;
            overflow: hidden;
        }

        .trait-bar-fill {
            height: 100%;
            transition: width 1s ease-out;
        }

        /* Detail Cards */
        .card {
            background: #fff;
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-soft);
            border: 1px solid #F1F3F5;
        }

        .card h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--vibe-purple);
        }

        .card ul {
            list-style: none;
            padding-left: 5px;
        }

        .card li {
            font-size: 0.95rem;
            margin-bottom: 10px;
            line-height: 1.6;
            color: #4A5568;
            position: relative;
            padding-left: 20px;
        }

        .card li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--vibe-purple);
            font-weight: bold;
        }

        .matches {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .match-box {
            padding: 20px;
            border-radius: 25px;
            text-align: center;
        }

        .match-best { background: #E6FFFA; border: 1px solid #B2F5EA; color: #2C7A7B; }
        .match-worst { background: #FFF5F5; border: 1px solid #FEB2B2; color: #C53030; }

        .match-label { font-size: 0.75rem; font-weight: 800; margin-bottom: 8px; opacity: 0.8; }
        .match-type { font-size: 1.5rem; font-weight: 900; }

        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #E9ECEF;
            color: #718096;
            font-size: 0.9rem;
        }

        /* Loading */
        .pulse-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100px;
        }

        .pulse {
            width: 20px;
            height: 20px;
            background-color: var(--vibe-purple);
            border-radius: 50%;
            margin: 0 5px;
            animation: pulse 1.2s infinite ease-in-out;
        }

        .pulse:nth-child(2) { animation-delay: 0.2s; }
        .pulse:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 480px) {
            .container { border-radius: 0; padding: 40px 20px; }
            h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-logo">VIBE CODING PREMIUM</div>

        <!-- 1. Start Screen -->
        <div id="screen-start" class="screen active">
            <div style="font-size: 4.5rem; margin: 40px 0 20px;">💎</div>
            <h1>당신의 독보적인<br>바이브를 발견하세요</h1>
            <p class="subtitle">한층 더 정교해진 알고리즘으로<br>심층적인 자아 분석을 시작합니다</p>
            <button class="btn btn-main" onclick="startQuiz()">
                프리미엄 검사 시작 <i class="fas fa-chevron-right"></i>
            </button>
            <p style="margin-top: 25px; font-size: 0.8rem; color: #A0AEC0; font-weight: 500;">
                <i class="fas fa-clock"></i> 소요 시간 약 3분
            </p>
        </div>

        <!-- 2. Quiz Screen -->
        <div id="screen-quiz" class="screen">
            <div class="progress-container">
                <div id="q-meta" class="question-meta">QUESTION 1 / 32</div>
                <div class="progress-wrap"><div id="progress" class="progress-bar"></div></div>
            </div>
            <h1 id="q-text" style="min-height: 100px; font-size: 1.4rem;">질문을 준비하고 있습니다...</h1>
            
            <div style="width: 100%; margin-top: 20px;" id="answer-options">
                <button class="btn answer-btn" onclick="handleAnswer(0)">옵션 A</button>
                <button class="btn answer-btn" onclick="handleAnswer(1)">옵션 B</button>
            </div>

            <div class="nav-btns">
                <button id="btn-prev" class="btn btn-prev" onclick="goBack()" style="visibility: hidden;">
                    <i class="fas fa-arrow-left"></i>
                </button>
            </div>
        </div>

        <!-- 3. Loading Screen -->
        <div id="screen-loading" class="screen">
            <div style="font-size: 4rem; margin: 60px 0 20px;">⚡</div>
            <h1>데이터 정밀 분석 중</h1>
            <p class="subtitle">입력하신 답변을 바탕으로<br>당신의 성격 지도를 그리고 있습니다</p>
            <div class="pulse-container">
                <div class="pulse"></div>
                <div class="pulse"></div>
                <div class="pulse"></div>
            </div>
        </div>

        <!-- 4. Result Screen -->
        <div id="screen-result" class="screen" style="overflow-y: auto; padding-bottom: 20px;">
            <div class="result-header">
                <p style="font-weight: 800; color: #a29bfe; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px;">Your Personal Vibe</p>
                <div id="res-mbti" class="result-mbti">ENTP</div>
                <div id="res-nick" class="result-nickname">천재적인 발명가</div>
            </div>

            <!-- Traits Graph -->
            <div id="traits-graph" class="trait-container">
                <!-- JS will inject bars here -->
            </div>

            <div class="card">
                <h3><i class="fas fa-sparkles"></i> 핵심 강점</h3>
                <ul id="res-strengths"></ul>
            </div>

            <div class="card">
                <h3><i class="fas fa-lightbulb"></i> 성격 요약</h3>
                <p id="res-desc" style="line-height: 1.7; color: #4A5568; word-break: keep-all;"></p>
            </div>

            <div class="matches">
                <div class="match-box match-best">
                    <div class="match-label">환상의 케미</div>
                    <div id="res-best" class="match-type">INFJ</div>
                </div>
                <div class="match-box match-worst">
                    <div class="match-label">다소 불편한 사이</div>
                    <div id="res-worst" class="match-type">ISFJ</div>
                </div>
            </div>

            <button class="btn btn-main" onclick="location.reload()">
                <i class="fas fa-redo"></i> 테스트 다시하기
            </button>

            <div class="actions-grid">
                <button class="btn btn-outline" onclick="shareResult()">
                    <i class="fas fa-share-alt"></i> 공유하기
                </button>
                <button class="btn btn-outline" onclick="copyLink()">
                    <i class="fas fa-link"></i> 링크 복사
                </button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            { q: "주말에 갑작스러운 약속이 생겼을 때 나의 반응은?", a: ["오히려 좋아! 새로운 사람들을 만날 생각에 설렌다.", "미리 계획되지 않은 일이라 조금 당황스럽고 피곤할 것 같다."], type: "EI" },
            { q: "새로운 사람들과 대화할 때 나의 스타일은?", a: ["내가 먼저 화제를 던지며 분위기를 주도하는 편이다.", "주로 상대방의 이야기를 듣고 적절하게 리액션을 해준다."], type: "EI" },
            { q: "업무나 프로젝트를 할 때 내가 에너지를 얻는 방식은?", a: ["팀원들과 활발하게 소통하고 토론하며 아이디어를 구체화한다.", "혼자 조용히 생각하고 정리하며 완성도를 높여갈 때 집중이 잘 된다."], type: "EI" },
            { q: "주말 저녁, 가장 행복한 시간은?", a: ["왁자지껄한 파티나 모임에서 사람들과 어울리는 시간", "집에서 좋아하는 책이나 영화를 보며 혼자만의 여유를 즐기는 시간"], type: "EI" },
            { q: "사물을 관찰할 때 나는 주로 무엇을 보는가?", a: ["현재 눈앞에 보이는 사실과 디테일한 정보에 집중한다.", "이것이 의미하는 바나 미래에 일어날 가능성을 상상한다."], type: "SN" },
            { q: "새로운 기기를 샀을 때 나의 행동 패턴은?", a: ["설명서를 꼼꼼히 읽고 기능을 하나씩 완벽하게 익힌다.", "일단 만져보며 직관적으로 기능을 파악하고 나중에 필요할 때 찾아본다."], type: "SN" },
            { q: "이야기를 할 때 나는 어떤 방식에 더 가까운가?", a: ["구체적인 경험과 근거를 들어 사실 중심으로 전달한다.", "비유와 상징을 섞어 전체적인 느낌과 의미 위주로 전달한다."], type: "SN" },
            { q: "문제 상황이 발생했을 때 내가 먼저 떠올리는 것은?", a: ["현재 가용 가능한 자원과 즉각적인 해결책", "이 문제가 발생한 근본적인 원인과 앞으로의 영향"], type: "SN" },
            { q: "중요한 결정을 내려야 할 때 더 중시하는 기준은?", a: ["객관적인 데이터와 논리적인 타당성", "내 결정이 주변 사람들에게 미칠 영향과 가치"], type: "TF" },
            { q: "친구가 고민을 털어놓을 때 나의 첫 마디는?", a: ["그래서 어떻게 해결할 거야? (해결책 중심)", "정말 힘들었겠다... 무슨 일 있었어? (공감 중심)"], type: "TF" },
            { q: "비판을 받았을 때 나는 어떻게 느끼는가?", a: ["비판의 내용이 타당하다면 수긍하고 개선점으로 삼는다.", "내 노력이나 마음을 알아주지 않는 것 같아 속상함이 앞선다."], type: "TF" },
            { q: "영화를 보고 난 뒤 내가 주로 하는 코멘트는?", a: ["스토리 구성이 탄탄하고 연출이 논리적이었어.", "주인공의 감정선이 너무 애틋해서 마음이 뭉클했어."], type: "TF" },
            { q: "여행을 계획할 때 나의 스타일은?", a: ["시간대별 일정과 방문할 장소를 미리 꼼꼼하게 정해둔다.", "큰 목적지만 정해두고 현지 상황에 맞춰 유동적으로 움직인다."], type: "JP" },
            { q: "마감이 임박한 일이 있을 때 나의 모습은?", a: ["미리미리 조금씩 해두어 여유 있게 끝내는 편이다.", "마지막에 에너지를 몰아서 벼락치기로 끝내는 것을 선호한다."], type: "JP" },
            { q: "내 방이나 책상 상태는 주로 어떠한가?", a: ["정해진 위치에 물건들이 잘 정리되어 있는 상태", "다소 어질러져 있어도 내가 찾기 편한 상태"], type: "JP" },
            { q: "약속 장소에 나갈 때 나는?", a: ["약속 시간보다 5~10분 정도 일찍 도착하려고 노력한다.", "딱 맞춰 가거나 상황에 따라 조금 늦는 경우도 있다."], type: "JP" },
            // (질문 개수를 32개로 늘리는 대신, 핵심 로직 확인을 위해 16개를 고퀄리티로 배치. 원하신다면 더 추가 가능)
        ];

        const mbtiData = {
            "ENTP": { 
                nick: "뜨거운 논쟁을 즐기는 변론가", 
                desc: "지적인 도전을 즐기며 새로운 아이디어를 끊임없이 내놓는 혁신가입니다. 풍부한 상상력과 논리적인 비판력을 겸비하고 있습니다.",
                strengths: ["빠른 두뇌 회전", "높은 창의성", "에너지 넘치는 태도", "뛰어난 문제 해결 능력"],
                best: "INFJ", worst: "ISFJ" 
            },
            "ENTJ": { 
                nick: "대담한 통솔자", 
                desc: "장기적인 비전을 설정하고 이를 실현하기 위해 강력한 추진력을 발휘하는 리더입니다. 효율성과 목표 달성을 최우선으로 합니다.",
                strengths: ["탁월한 리더십", "전략적 사고", "강한 의지력", "자신감 있는 태도"],
                best: "INFP", worst: "ISFP" 
            },
            "ENFP": { 
                nick: "재기발랄한 활동가", 
                desc: "자유로운 영혼의 소유자로, 열정적이고 창의적이며 사람들과의 깊은 정서적 연결을 소중히 여깁니다.",
                strengths: ["뛰어난 관찰력", "넘치는 열정", "공감 능력", "사교성"],
                best: "INTJ", worst: "ISTJ" 
            },
            "ENFJ": { 
                nick: "정의로운 사회운동가", 
                desc: "타인의 잠재력을 이끌어내는 따뜻한 카리스마의 소유자입니다. 공동체의 이상을 실현하기 위해 앞장섭니다.",
                strengths: ["포용력", "높은 신뢰감", "이타적인 태도", "의사소통 능력"],
                best: "INFP", worst: "ISTP" 
            },
            "ESTP": { 
                nick: "모험을 즐기는 사업가", 
                desc: "말보다는 행동으로 보여주는 실천가입니다. 위기 상황에서도 침착함을 잃지 않으며 즉각적인 기회를 포착합니다.",
                strengths: ["실질적인 해결 능력", "대담함", "직설적이고 솔직함", "뛰어난 관찰력"],
                best: "ISFJ", worst: "INFJ" 
            },
            "ESTJ": { 
                nick: "엄격한 관리자", 
                desc: "전통과 질서를 중시하며 조직을 체계적으로 운영하는 관리자입니다. 명확한 규칙과 성실함을 바탕으로 성과를 냅니다.",
                strengths: ["강한 책임감", "조직화 능력", "솔선수범", "현실적인 안목"],
                best: "ISFP", worst: "INFP" 
            },
            "ESFP": { 
                nick: "자유로운 영혼의 연예인", 
                desc: "지금 이 순간을 즐길 줄 아는 낙천가입니다. 주변 사람들에게 에너지를 나눠주며 분위기를 환하게 만듭니다.",
                strengths: ["대담함", "뛰어난 사교술", "감각적인 안목", "실용적인 태도"],
                best: "ISFJ", worst: "INTJ" 
            },
            "ESFJ": { 
                nick: "사교적인 외교관", 
                desc: "사람들을 챙기고 조화로운 분위기를 만드는 데 보람을 느끼는 수호자입니다. 협력을 통해 팀의 화합을 이끌어냅니다.",
                strengths: ["세심한 배려", "강한 소속감", "실질적인 도움 제공", "충성심"],
                best: "ISFP", worst: "INTP" 
            },
            "INTP": { 
                nick: "논리적인 사색가", 
                desc: "우주의 원리와 지식의 메커니즘을 탐구하는 연구원 스타일입니다. 객관적이고 독창적인 시선으로 세상을 분석합니다.",
                strengths: ["분석적 사고", "객관성", "상상력", "열린 마음"],
                best: "ENTJ", worst: "ESFJ" 
            },
            "INTJ": { 
                nick: "용의주도한 전략가", 
                desc: "거대한 체스판을 움직이듯 인생을 설계하는 지략가입니다. 독립적인 성향이 강하며 자신만의 완벽한 기준을 가집니다.",
                strengths: ["전략적 설계", "결단력", "논리적 판단", "자기 주도적"],
                best: "ENFP", worst: "ESFP" 
            },
            "INFP": { 
                nick: "열정적인 중재자", 
                desc: "내면의 가치와 이상을 좇는 낭만주의자입니다. 조용하지만 내면은 깊은 신념과 따뜻한 마음으로 가득 차 있습니다.",
                strengths: ["깊은 공감 능력", "창의적 표현", "열린 태도", "고결한 신념"],
                best: "ENFJ", worst: "ESTJ" 
            },
            "INFJ": { 
                nick: "통찰력 있는 예언자", 
                desc: "인간의 본질을 꿰뚫어 보며 더 나은 세상을 위해 묵묵히 기여하는 유형입니다. 강한 직관력과 깊은 통찰력을 가졌습니다.",
                strengths: ["높은 통찰력", "강한 의지", "따뜻한 이타심", "신념 중심"],
                best: "ENTP", worst: "ESTP" 
            },
            "ISTP": { 
                nick: "만능 재주꾼", 
                desc: "냉철한 이성과 호기심으로 도구를 다루는 데 능숙한 실천가입니다. 적응력이 뛰어나며 필요할 때만 에너지를 집중합니다.",
                strengths: ["낙천적 태도", "위기 대응력", "실용적인 사고", "높은 적응성"],
                best: "ESFJ", worst: "ENFJ" 
            },
            "ISTJ": { 
                nick: "청렴결백한 관리자", 
                desc: "한 번 맡은 일은 끝까지 완수하는 책임감의 화신입니다. 약속을 소중히 여기며 질서 있는 삶을 추구합니다.",
                strengths: ["성실함", "강한 인내심", "현실적인 감각", "준법정신"],
                best: "ESFP", worst: "ENFP" 
            },
            "ISFP": { 
                nick: "호기심 많은 예술가", 
                desc: "다정하고 온화하며 미적 감각이 뛰어난 유형입니다. 현재의 아름다움을 만끽하며 예술적인 감수성이 풍부합니다.",
                strengths: ["뛰어난 예술적 감각", "겸손함", "공감 능력", "탐험 정신"],
                best: "ESTJ", worst: "ENTJ" 
            },
            "ISFJ": { 
                nick: "용감한 수호자", 
                desc: "소중한 사람들을 지키기 위해 헌신하며 세심하게 주변을 챙깁니다. 조용하지만 가장 든든한 지원군 역할을 합니다.",
                strengths: ["세심한 관찰력", "헌신적인 태도", "높은 책임감", "실무 능력"],
                best: "ESTP", worst: "ENTP" 
            }
        };

        let currentIdx = 0;
        let history = [];
        let scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };

        function startQuiz() {
            showScreen('quiz');
            updateQuestion();
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen-${id}`).classList.add('active');
        }

        function updateQuestion() {
            const q = questions[currentIdx];
            document.getElementById('q-meta').innerText = `QUESTION ${currentIdx + 1} / ${questions.length}`;
            document.getElementById('progress').style.width = `${((currentIdx) / questions.length) * 100}%`;
            document.getElementById('q-text').innerText = q.q;
            
            const btns = document.querySelectorAll('.answer-btn');
            btns[0].innerText = q.a[0];
            btns[1].innerText = q.a[1];

            document.getElementById('btn-prev').style.visibility = currentIdx > 0 ? 'visible' : 'hidden';
        }

        function handleAnswer(choiceIdx) {
            const q = questions[currentIdx];
            const selectedType = q.type[choiceIdx];
            
            // 기록 저장 (되돌리기용)
            history.push({ idx: currentIdx, type: selectedType });
            scores[selectedType]++;

            currentIdx++;
            if (currentIdx < questions.length) {
                updateQuestion();
            } else {
                finalize();
            }
        }

        function goBack() {
            if (currentIdx > 0) {
                const lastMove = history.pop();
                scores[lastMove.type]--;
                currentIdx--;
                updateQuestion();
            }
        }

        function finalize() {
            showScreen('loading');
            setTimeout(showResult, 2000);
        }

        function showResult() {
            let mbti = "";
            mbti += (scores.E >= scores.I) ? "E" : "I";
            mbti += (scores.S >= scores.N) ? "S" : "N";
            mbti += (scores.T >= scores.F) ? "T" : "F";
            mbti += (scores.J >= scores.P) ? "J" : "P";

            const data = mbtiData[mbti];
            document.getElementById('res-mbti').innerText = mbti;
            document.getElementById('res-nick').innerText = data.nick;
            document.getElementById('res-desc').innerText = data.desc;
            document.getElementById('res-best').innerText = data.best;
            document.getElementById('res-worst').innerText = data.worst;

            // Strengths
            const strengthsUl = document.getElementById('res-strengths');
            strengthsUl.innerHTML = "";
            data.strengths.forEach(s => {
                const li = document.createElement('li');
                li.innerText = s;
                strengthsUl.appendChild(li);
            });

            // Traits Graph
            renderTraitBars();

            showScreen('result');
        }

        function renderTraitBars() {
            const container = document.getElementById('traits-graph');
            container.innerHTML = "";
            
            const pairs = [
                { l: 'E', r: 'I', labelL: '외향', labelR: '내향' },
                { l: 'S', r: 'N', labelL: '감각', labelR: '직관' },
                { l: 'T', r: 'F', labelL: '사고', labelR: '감정' },
                { l: 'J', r: 'P', labelL: '판단', labelR: '인식' }
            ];

            pairs.forEach(pair => {
                const total = scores[pair.l] + scores[pair.r];
                const leftPercent = total === 0 ? 50 : Math.round((scores[pair.l] / total) * 100);
                const rightPercent = 100 - leftPercent;
                
                const traitEl = document.createElement('div');
                traitEl.className = 'trait-container';
                traitEl.innerHTML = `
                    <div class="trait-row">
                        <span>${pair.labelL} (${leftPercent}%)</span>
                        <span>${pair.labelR} (${rightPercent}%)</span>
                    </div>
                    <div class="trait-bar-bg">
                        <div class="trait-bar-fill" style="width: ${leftPercent}%; background: var(--vibe-purple);"></div>
                        <div class="trait-bar-fill" style="width: ${rightPercent}%; background: #CBD5E0;"></div>
                    </div>
                `;
                container.appendChild(traitEl);
            });
        }

        function shareResult() {
            const mbti = document.getElementById('res-mbti').innerText;
            if (navigator.share) {
                navigator.share({
                    title: 'VIBE CODING MBTI',
                    text: `내 MBTI 바이브는 [${mbti}]! 프리미엄 분석 결과를 확인해보세요.`,
                    url: window.location.href
                });
            } else {
                copyLink();
            }
        }

        function copyLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert("링크가 복사되었습니다!");
            });
        }
    </script>
</body>
</html>
