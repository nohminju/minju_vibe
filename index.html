<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 프리미엄 심층 MBTI 성격 진단 프로그램 🌟</title>
    <style>
        :root {
            --primary-color: #6C5CE7;
            --secondary-color: #A29BFE;
            --success-color: #00B894;
            --warning-color: #D63031;
            --background-color: #F8F9FA;
            --text-color: #2D3436;
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06);
            padding: 45px 35px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 메인 버튼 스타일 */
        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 1.15rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.3);
        }
        .btn:hover {
            background: #5b4bc4;
            transform: translateY(-2px);
        }

        /* 퀴즈 공통 */
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #dfe6e9;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary-color), var(--primary-color));
            width: 0%;
            transition: width 0.3s ease;
        }
        .question-count {
            font-size: 0.95rem;
            color: #b2bec3;
            font-weight: 600;
            margin-bottom: 30px;
        }
        .question-text {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 40px;
            line-height: 1.6;
            word-break: keep-all;
        }
        .answer-btn {
            width: 100%;
            background: #F1F2F6;
            border: 2px solid transparent;
            padding: 20px;
            font-size: 1.05rem;
            font-weight: 500;
            border-radius: 16px;
            cursor: pointer;
            margin-bottom: 16px;
            text-align: left;
            transition: all 0.2s ease;
            color: var(--text-color);
            line-height: 1.4;
        }
        .answer-btn:hover {
            background: #E4E7EB;
            border-color: var(--secondary-color);
            transform: translateX(4px);
        }

        /* 심층 결과 리포트 스타일 */
        .mbti-title {
            font-size: 4rem;
            font-weight: 900;
            color: var(--primary-color);
            letter-spacing: 3px;
            margin-bottom: 5px;
        }
        .mbti-emoji {
            font-size: 5.5rem;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }
        .mbti-nickname {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 35px;
            color: #2d3436;
        }

        /* 결과 섹션 카드 공통 */
        .section-card {
            background: #F8F9FA;
            padding: 25px;
            border-radius: 18px;
            text-align: left;
            margin-bottom: 25px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .section-card h3 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-card p {
            line-height: 1.7;
            color: #4a4a4a;
            font-size: 1.02rem;
            word-break: keep-all;
        }
        .section-card ul {
            list-style: none;
            padding-left: 0;
        }
        .section-card li {
            margin-bottom: 12px;
            line-height: 1.6;
            font-size: 0.98rem;
            position: relative;
            padding-left: 26px;
            color: #4a4a4a;
        }
        .section-card li::before {
            position: absolute;
            left: 0;
            top: 1px;
            font-size: 1.05rem;
        }

        /* 리스트 아이콘 처리 */
        .strength-card h3 { color: var(--success-color); }
        .strength-card li::before { content: "✅"; }
        .weakness-card h3 { color: var(--warning-color); }
        .weakness-card li::before { content: "⚠️"; }
        .advice-card h3 { color: var(--primary-color); }
        .advice-card li::before { content: "💡"; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. 시작 화면 -->
        <div id="start-screen" class="screen active">
            <div style="font-size: 4.5rem; margin-bottom: 25px;">📊</div>
            <h1 style="font-size: 2.2rem; margin-bottom: 15px; color: var(--primary-color);">정밀 성격 진단 프로그램</h1>
            <p style="font-size: 1.1rem; color: #636e72; margin-bottom: 35px; line-height: 1.6;">
                심층 분석 알고리즘이 적용된 32개 문항을 통해<br>당신의 성격 특성, 장단점, 그리고 성장 전략을 확인하세요.
            </p>
            <button class="btn" onclick="startQuiz()">정식 진단 시작</button>
        </div>

        <!-- 2. 퀴즈 화면 -->
        <div id="quiz-screen" class="screen">
            <div class="progress-bar"><div id="progress" class="progress"></div></div>
            <div id="question-count" class="question-count">1 / 32</div>
            <div id="question-text" class="question-text">질문 로딩 중...</div>
            <div id="answer-buttons">
                <button class="answer-btn" onclick="selectAnswer(0)">선택지 1</button>
                <button class="answer-btn" onclick="selectAnswer(1)">선택지 2</button>
            </div>
        </div>

        <!-- 3. 결과 화면 -->
        <div id="result-screen" class="screen">
            <p style="font-size: 1.1rem; color: #636e72; font-weight: bold; margin-bottom: 5px;">종합 진단 결과</p>
            <div id="mbti-title" class="mbti-title">결과</div>
            <div id="mbti-emoji" class="mbti-emoji">✨</div>
            <div id="mbti-nickname" class="mbti-nickname">유형명</div>
            
            <!-- [1] 심층 특징 해설 -->
            <div class="section-card">
                <h3>🔍 심층 성격 해설</h3>
                <p id="mbti-desc">성격 설명 분석 데이터 출력 구역입니다.</p>
            </div>

            <!-- [2] 주요 장점 -->
            <div class="section-card strength-card">
                <h3>👑 핵심 역량 및 장점 (Strengths)</h3>
                <ul id="mbti-strengths"></ul>
            </div>

            <!-- [3] 주요 단점 -->
            <div class="section-card weakness-card">
                <h3>치명적인 단점 및 리스크 (Weaknesses)</h3>
                <ul id="mbti-weaknesses"></ul>
            </div>

            <!-- [4] 보완점 및 성장 제언 -->
            <div class="section-card advice-card">
                <h3>성장과 발전을 위한 솔루션 (Growth Advice)</h3>
                <ul id="mbti-advices"></ul>
            </div>

            <button class="btn" onclick="restartQuiz()" style="margin-top: 15px;">테스트 재시작</button>
        </div>
    </div>

    <script>
        // 32가지 밸런스 검증 문항 데이터
        const questions = [
            // E vs I (외향 vs 내향)
            { q: "프로젝트를 끝내고 주말을 맞이했을 때, 나에게 가장 완벽한 충전법은?", a: ["밀린 모임에 나가 사람들과 왁자지껄 떠들며 에너지를 발산한다.", "온전히 나만의 공간에서 방해받지 않고 푹 쉬며 정적인 시간을 보낸다."], type: "EI" },
            { q: "새로운 모임이나 파티에 참여했을 때 나의 자연스러운 포지션은?", a: ["처음 본 사람들에게도 스스럼없이 다가가 대화를 트고 분위기를 주도한다.", "이야기가 잘 통할 것 같은 소수 곁에 머물거나 상대가 말을 걸어주길 기다린다."], type: "EI" },
            { q: "모르는 사람과 엘리베이터나 조용한 공간에 단둘이 갇혔을 때 나는?", a: ["어색함을 깨기 위해 오늘 날씨나 가벼운 스몰토크를 먼저 건넨다.", "굳이 말을 걸기보다는 스마트폰을 보거나 먼 산을 보며 조용히 시간을 보낸다."], type: "EI" },
            { q: "팀 회의에서 번뜩이는 아이디어가 생각났을 때 나의 행동은?", a: ["생각나는 즉시 말로 뱉으면서 동료들과 실시간으로 아이디어를 다듬어 나간다.", "머릿속으로 논리를 완벽하게 정리하고 정돈한 뒤 조심스럽게 꺼내거나 글로 쓴다."], type: "EI" },
            { q: "극심한 스트레스를 받았을 때 나를 구원하는 해결책은?", a: ["친한 사람들을 만나 속 시원하게 수다를 떨고 감정을 털어내야 한다.", "혼자 조용히 생각할 시간을 가지며 내면의 엉킨 실타래를 정리해야 한다."], type: "EI" },
            { q: "전화 벨소리가 울릴 때 드는 나의 솔직한 심정은?", a: ["반갑게 전화를 받아 바로 다이렉트로 소통하는 것이 편하다.", "용건이 명확하지 않은 전화는 다소 부담스럽고, 카톡이나 문자가 편하다."], type: "EI" },
            { q: "공개적인 자리에서 갑작스럽게 자기소개나 발표 요청을 받는다면?", a: ["즉흥적으로 떠오르는 대로 위트 있게 상황을 모면하며 유연하게 대처한다.", "머릿속이 하얘지며 미리 준비된 대본이 없다는 것에 큰 긴장감을 느낀다."], type: "EI" },
            { q: "내가 꿈꾸는 이상적인 여행의 형태에 가까운 것은?", a: ["현지 게스트하우스나 파티에서 낯선 여행자들과 적극적으로 교류하는 여행", "풍경이 좋은 곳에서 힐링하거나 마음이 완벽하게 맞는 소수와 떠나는 안락한 여행"], type: "EI" },

            // S vs N (감각 vs 직관)
            { q: "공상 과학 소설이나 영화를 볼 때 내가 더 흥미를 느끼는 지점은?", a: ["현실에서 일어남 직한 정교한 고증, 개연성 있는 스토리와 인물들의 대사", "작품 이면에 숨겨진 철학적 은유, 세계관 자체의 파격성과 거대한 메시지"], type: "SN" },
            { q: "조립식 가구나 복잡한 전자기기를 새로 구입했을 때 나는?", a: ["동봉된 설명서를 1페이지부터 꼼꼼하게 읽고 순서대로 조립/조작한다.", "설명서는 보지 않거나 대충 훑어보고, 직관적으로 만져보면서 감을 익힌다."], type: "SN" },
            { q: "길을 가다가 정말 독특하고 예쁜 건축물을 발견했을 때 생각의 흐름은?", a: ["자재를 뭐 썼지? 인테리어 비용 많이 들었겠다. 마감이 깔끔하네.", "여기서 과거엔 누가 살았을까? 나중에 여기서 판타지 소설 쓰면 대박 나겠다."], type: "SN" },
            { q: "단어 연상 퀴즈에서 '바다'라는 단어를 들었을 때 머릿속 풍경은?", a: ["푸른 파도, 짠 냄새, 해운대 모래사장, 조개구이 등 눈에 보이는 실체", "자유, 미지의 세계, 지구 온난화, 심해어, 끝없는 우주 같은 확장된 개념"], type: "SN" },
            { q: "타인에게 복잡한 약속 장소 위치를 알려줄 때 나의 스타일은?", a: ["강남역 10번 출구에서 150m 직진 후 다이소 건물 끼고 골목으로 들어오세요.", "거기 강남역 메인 스트리트 쭉 걷다 보면 되게 크고 화려한 건물 있거든? 그 근처야."], type: "SN" },
            { q: "침대에 누워 '만약 내일 당장 외계인이 침공한다면?' 같은 상상을 할 때", a: ["비현실적인 가정이라 시간 낭비라 생각하며 이내 생각을 접는다.", "생존 가방 품목을 짜고 정부의 대응 체계까지 생각하며 꼬리에 꼬리를 물고 상상한다."], type: "SN" },
            { q: "커리어 측면에서 내가 일의 보람과 안정감을 느끼는 업무 환경은?", a: ["기존의 명확한 데이터, 정형화된 매뉴얼, 성공 사례가 입증된 안전한 업무", "아무것도 없는 제로 베이스에서 나만의 창의적 아이디어로 기획해 나가는 모험적인 업무"], type: "SN" },
            { q: "주말 특강을 신청하려고 한다. 두 주제 중 훨씬 끌리는 강연은?", a: ["당장 월요일부터 내 통장과 업무에 적용 가능한 '재테크 및 실무 팁'", "인간의 본질과 문명의 미래를 조망하는 '인문학 및 미래 기술 대예측'"], type: "SN" },

            // T vs F (사고 vs 감정)
            { q: "친한 친구가 울먹이며 '나 운전하다 사고 났어...' 라고 전화를 했다면?", a: ["어디서? 너 과실이야? 몸은 괜찮아? 보험사는 불렀어?", "헉 진짜?! 어디 다친 데는 없어?! 놀란 가슴 진정해봐ㅠㅠ 많이 놀랐겠다."], type: "TF" },
            { q: "슬픈 영화나 예능 프로그램을 보면서 폭풍 눈물을 흘리는 사람을 볼 때", a: ["상황은 슬프지만 저렇게까지 오열할 일인가 이성적으로 분석하려 든다.", "저 사람의 슬픔이 나에게 전염된 듯 마음이 아프고 눈시울이 붉어진다."], type: "TF" },
            { q: "지인이 진지한 표정으로 인생의 큰 고민을 털어놓을 때 내가 해주는 역할은?", a: ["문제를 명확히 짚어내고 상황을 타개할 수 있는 '해결책과 뼈 때리는 조언'", "상대의 마음에 깊이 동조하고 편을 들어주는 '따뜻한 공감과 위로의 언어'"], type: "TF" },
            { q: "회사나 학교에서 큰 프로젝트를 마친 나에게 최고의 찬사는?", a: ["'너 일 진짜 똑부러지게 잘한다. 결과물 퀄리티가 장난 아닌데?'", "'너 이번에 고생 진짜 많았어. 네가 팀 분위기 다 살린 거 알지?'"], type: "TF" },
            { q: "친구가 산 옷이 솔직히 별로인데 '나 오늘 어때?'라고 평가를 구한다면?", a: ["'음, 옷은 예쁜데 네 체형이나 퍼스널 컬러엔 좀 안 어울리는 것 같아.' (솔직)", "'와 진짜 유니크하다! 네가 만족하고 좋으면 그게 패션이지!' (기분 존중)"], type: "TF" },
            { q: "비즈니스 회의 중 내 의견에 대해 동료가 정교한 논리로 비판을 해왔을 때", a: ["그의 논리가 맞다면 내 감정과 상관없이 쿨하게 수용하고 발전적 힌트로 삼는다.", "논리를 떠나 공식 석상에서 나를 저격했다는 생각에 은근히 마음이 상한다."], type: "TF" },
            { q: "인간관계나 사회생활을 할 때 내가 가장 기본으로 삼는 신념은?", a: ["공평성과 정의, 냉철한 규칙 적용이 사회를 건강하게 만든다.", "서로를 향한 따뜻한 배려와 이타심이 세상을 아름답게 만든다."], type: "TF" },

        let currentIdx = 0;
        let scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function startQuiz() {
            currentIdx = 0;
            scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
            showScreen('quiz-screen');
            updateQuestion();
        }

        function updateQuestion() {
            if (currentIdx >= questions.length) {
                showResult();
                return;
            }

            const qData = questions[currentIdx];
            document.getElementById('question-count').innerText = `${currentIdx + 1} / ${questions.length}`;
            document.getElementById('question-text').innerText = qData.q;
            
            const btns = document.querySelectorAll('.answer-btn');
            btns[0].innerText = qData.a[0];
            btns[1].innerText = qData.a[1];

            const percent = (currentIdx / questions.length) * 100;
            document.getElementById('progress').style.width = `${percent}%`;
        }

        function selectAnswer(btnIdx) {
            const qData = questions[currentIdx];
            const typeKey = qData.type;
            
            if (btnIdx === 0) {
                scores[typeKey[0]]++;
            } else {
                scores[typeKey[1]]++;
            }

            currentIdx++;
            updateQuestion();
        }

        function showResult() {
            document.getElementById('progress').style.width = `100%`;

            let mbti = "";
            mbti += (scores.E >= scores.I) ? "E" : "I";
            mbti += (scores.S >= scores.N) ? "S" : "N";
            mbti += (scores.T >= scores.F) ? "T" : "F";
            mbti += (scores.J >= scores.P) ? "J" : "P";

            // 문자열 앞뒤 공백을 확실하게 자르는 .trim() 안전장치 탑재!
            const targetMbti = mbti.trim();
            const result = mbtiPremiumDB[targetMbti];

            // 매핑 데이터 에러 헨들링 백업 코드
            if (!result) {
                alert("결과 도출 중 오류가 발생했습니다. 유형 코드: " + targetMbti);
                return;
            }

            // 데이터 바인딩
            document.getElementById('mbti-title').innerText = targetMbti;
            document.getElementById('mbti-emoji').innerText = result.emoji;
            document.getElementById('mbti-nickname').innerText = result.nickname;
            document.getElementById('mbti-desc').innerText = result.desc;

            // 장점 바인딩
            const strengthsUl = document.getElementById('mbti-strengths');
            strengthsUl.innerHTML = "";
            result.strengths.forEach(s => {
                const li = document.createElement('li');
                li.innerText = s;
                strengthsUl.appendChild(li);
            });

            // 단점 바인딩
            const weaknessesUl = document.getElementById('mbti-weaknesses');
            weaknessesUl.innerHTML = "";
            result.weaknesses.forEach(w => {
                const li = document.createElement('li');
                li.innerText = w;
                weaknessesUl.appendChild(li);
            });

            // 보완점 바인딩
            const advicesUl = document.getElementById('mbti-advices');
            advicesUl.innerHTML = "";
            result.advices.forEach(a => {
                const li = document.createElement('li');
                li.innerText = a;
                advicesUl.appendChild(li);
            });

            setTimeout(() => {
                showScreen('result-screen');
            }, 300);
        }

        function restartQuiz() {
            showScreen('start-screen');
        }
