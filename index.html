<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 나만의 성격 유형 MBTI 테스트 ✨</title>
    <style>
        :root {
            --primary-color: #6C5CE7;
            --secondary-color: #A29BFE;
            --background-color: #F8F9FA;
            --text-color: #2D3436;
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 컨테이너 및 섹션 배치 */
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 40px 30px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 시작 화면 */
        .start-screen h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--primary-color);
        }
        .start-screen p {
            font-size: 1.1rem;
            color: #636e72;
            margin-bottom: 30px;
        }
        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
        }
        .btn:hover {
            background: #5b4bc4;
            transform: translateY(-2px);
        }

        /* 퀴즈 화면 */
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #dfe6e9;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }
        .question-count {
            font-size: 0.9rem;
            color: #b2bec3;
            margin-bottom: 25px;
        }
        .question-text {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 35px;
            line-height: 1.5;
            word-break: keep-all;
        }
        .answer-btn {
            width: 100%;
            background: #F1F2F6;
            border: 2px solid transparent;
            padding: 18px 20px;
            font-size: 1.05rem;
            border-radius: 15px;
            cursor: pointer;
            margin-bottom: 15px;
            text-align: left;
            transition: all 0.2s ease;
            color: var(--text-color);
        }
        .answer-btn:hover {
            background: #E4E7EB;
            border-color: var(--secondary-color);
            transform: translateX(5px);
        }

        /* 결과 화면 */
        .result-screen h2 {
            font-size: 1.4rem;
            color: #636e72;
            margin-bottom: 5px;
        }
        .mbti-title {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--primary-color);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .mbti-emoji {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        .mbti-nickname {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 25px;
            color: #2d3436;
        }
        .desc-box {
            background: #F8F9FA;
            padding: 20px;
            border-radius: 15px;
            text-align: left;
            margin-bottom: 30px;
            border-left: 5px solid var(--primary-color);
        }
        .desc-box li {
            margin-bottom: 10px;
            line-height: 1.6;
            list-style-type: none;
            position: relative;
            padding-left: 20px;
        }
        .desc-box li::before {
            content: "✨";
            position: absolute;
            left: 0;
            top: 2px;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. 시작 화면 -->
        <div id="start-screen" class="screen active">
            <div style="font-size: 4rem; margin-bottom: 20px;">🧠</div>
            <h1>나의 진짜 성격 MBTI 찾기</h1>
            <p>총 32개의 문항으로 알아보는 정밀 MBTI 테스트</p>
            <button class="btn" onclick="startQuiz()">테스트 시작하기</button>
        </div>

        <!-- 2. 퀴즈 화면 -->
        <div id="quiz-screen" class="screen">
            <div class="progress-bar"><div id="progress" class="progress"></div></div>
            <div id="question-count" class="question-count">1 / 32</div>
            <div id="question-text" class="question-text">질문 텍스트가 들어갈 자리입니다.</div>
            <div id="answer-buttons">
                <button class="answer-btn" onclick="selectAnswer(0)">선택지 1</button>
                <button class="answer-btn" onclick="selectAnswer(1)">선택지 2</button>
            </div>
        </div>

        <!-- 3. 결과 화면 -->
        <div id="result-screen" class="screen">
            <h2>당신의 성격 유형은?</h2>
            <div id="mbti-title" class="mbti-title">INFP</div>
            <div id="mbti-emoji" class="mbti-emoji">🦄</div>
            <div id="mbti-nickname" class="mbti-nickname">열정적인 중재자</div>
            <div class="desc-box">
                <ul id="mbti-desc">
                    <!-- 설명이 동적으로 들어옴 -->
                </ul>
            </div>
            <button class="btn" onclick="restartQuiz()">다시 테스트하기</button>
        </div>
    </div>

    <script>
        // 32가지 문항 데이터 (E/I, S/N, T/F, J/P 각 8문항씩 배치)
        const questions = [
            // 1~8: E vs I
            { q: "주말에 에너지를 충전하는 방법은?", a: ["친구들을 만나 밖에서 신나게 논다", "집에서 혼자 넷플릭스를 보며 쉰다"], type: "EI" },
            { q: "새로운 모임에 갔을 때 나는?", a: ["먼저 사람들에게 다가가 대화를 주도한다", "상대방이 먼저 말을 걸어줄 때까지 기다린다"], type: "EI" },
            { q: "낯선 사람과 단둘이 엘리베이터를 탔을 때", a: ["가벼운 인사나 날씨 이야기를 건넨다", "스마트폰을 보며 어색함을 견딘다"], type: "EI" },
            { q: "다수가 참여하는 회의나 팀 프로젝트에서 나는?", a: ["의견을 적극적으로 소리 내어 말한다", "생각을 정리한 후 조심스럽게 말하거나 글로 쓴다"], type: "EI" },
            { q: "스트레스를 심하게 받았을 때?", a: ["친한 사람들과 수다를 떨며 풀어야 한다", "혼자만의 방에서 생각을 정리해야 한다"], type: "EI" },
            { q: "나에게 '전화 통화'란?", a: ["만나서 이야기하는 것만큼 편하고 좋다", "용건이 없으면 굳이 하기 부담스럽다"], type: "EI" },
            { q: "자기소개를 해야 하는 상황이 오면?", a: ["크게 긴장하지 않고 유연하게 대처한다", "무슨 말을 해야 할지 미리 머릿속으로 대본을 짠다"], type: "EI" },
            { q: "내가 더 선호하는 여행 스타일은?", a: ["게스트하우스 등에서 새로운 사람들과 교류하는 여행", "휴식 위주나 정말 친한 소수와만 함께하는 여행"], type: "EI" },

            // 9~16: S vs N
            { q: "영화나 소설을 볼 때 내가 더 집중하는 것은?", a: ["현실감 있는 스토리와 주인공의 구체적인 대사", "작품이 담고 있는 숨겨진 의미와 세계관"], type: "SN" },
            { q: "새로운 가전제품을 샀을 때 나는?", a: ["설명서를 꼼꼼히 읽고 정석대로 작동시킨다", "일단 감으로 켜보고 만지면서 배운다"], type: "SN" },
            { q: "친구와 길을 걷다 예쁜 카페를 발견했다면?", a: ["인테리어가 깔끔하고 커피 맛이 어떨지 생각한다", "여기서 나중에 이벤트를 하거나 소설을 쓰면 어떨지 상상한다"], type: "SN" },
            { q: "사과를 보고 처음 드는 생각은?", a: ["빨갛고 맛있겠다, 아삭아삭하겠다", "스티브 잡스, 뉴턴의 만유인력, 독사과..."], type: "SN" },
            { q: "길을 설명해 줄 때 나는?", a: ["은행에서 우회전해서 100m 직진한 뒤 편의점 골목으로 가세요", "이쪽으로 쭉 가다가 큰 건물 보이면 우회전하세요"], type: "SN" },
            { q: "만약 내가 하늘을 날 수 있게 된다면?", a: ["현실적으로 불가능하므로 깊게 생각지 않는다", "어디로 날아갈지, 정부에서 날 잡아가진 않을지 진지하게 상상한다"], type: "SN" },
            { q: "일을 배울 때 더 선호하는 방식은?", a: ["기존의 명확한 매뉴얼과 선례가 있는 일", "나만의 창의적인 아이디어를 적용할 수 있는 일"], type: "SN" },
            { q: "강연을 들을 때 더 흥미로운 주제는?", a: ["당장 내 삶에 적용할 수 있는 실용적인 팁", "미래 트렌드나 인간의 본질에 대한 거시적인 이론"], type: "SN" },

            // 17~24: T vs F
            { q: "친구가 '나 교통사고 났어'라고 연락이 왔을 때 나의 첫 마디는?", a: ["보험은 처리했어? 과실 비율은? 어디 박았는데?", "헉 정말?! 어디 다친 데는 없어? 많이 놀랐겠다ㅠㅠ"], type: "TF" },
            { q: "영화나 드라마를 보면서 우는 사람을 보면?", a: ["왜 우는지 이성적으로 이해가 안 갈 때가 있다", "감정에 깊게 이입되어 나도 모르게 눈물이 난다"], type: "TF" },
            { q: "친구의 고민 상담을 해줄 때 내가 주로 하는 행동은?", a: ["문제를 해결할 수 있는 현실적인 해결책 제시", "친구의 마음에 공감해주고 위로의 말 건네기"], type: "TF" },
            { q: "열심히 준비한 프로젝트 결과가 안 좋을 때 듣고 싶은 위로는?", a: ["이번엔 분석이 좀 아쉬웠네. 다음엔 프로세스를 바꿔보자.", "결과는 아쉽지만 너 진짜 밤새 가며 고생 많았어."], type: "TF" },
            { q: "친구가 어울리지 않는 옷을 사고 '어때?'라고 물어본다면?", a: ["음... 솔직히 네 체형이나 톤에는 좀 안 어울리는 것 같아.", "우와 특이하다! 네가 마음에 들면 좋은 거지!"], type: "TF" },
            { q: "내가 생각하는 '더 나은 세상'이란?", a: ["법과 규칙이 공정하고 이성적으로 돌아가는 세상", "사람들이 서로를 배려하고 따뜻한 정이 넘치는 세상"], type: "TF" },
            { q: "동료가 내 업무 방식에 피드백(지적)을 주었을 때?", a: ["논리적으로 맞다면 능력을 키울 좋은 기회로 여긴다", "나를 싫어해서 비판하는 건가 싶어 마음이 상한다"], type: "TF" },
            { q: "친구가 '우울해서 화분 샀어'라고 했을 때 나의 반응은?", a: ["우울한 거랑 화분 사는 거랑 무슨 상관이야? 무슨 화분?", "무슨 일 있어? 왜 우울해ㅠㅠ 화분 보며 힐링해..."], type: "TF" },

            // 25~32: J vs P
            { q: "여행을 가기 전 나의 계획 수립 정도는?", a: ["시간대별 일정, 맛집, 대안 경로까지 엑셀로 정리한다", "비행기표와 숙소만 끊고 세부 일정은 가서 생각한다"], type: "JP" },
            { q: "과제나 마감일이 있는 업무를 처리할 때?", a: ["미리 일정을 분배해서 여유 있게 끝낸다", "미루고 미루다 마감 직전의 초인적인 힘(벼락치기)으로 끝낸다"], type: "JP" },
            { q: "방 청소나 정리를 할 때 나는?", a: ["모든 물건은 제자리가 있어야 마음이 편하다", "필요할 때 찾을 수만 있으면 좀 어질러져 있어도 된다"], type: "JP" },
            { q: "약속 시간이 당일 아침에 갑자기 취소된다면?", a: ["이미 준비 다 해놨는데... 계획이 틀어져서 스트레스 받는다", "오히려 좋아! 집에서 뒹굴거릴 꿀 같은 시간이 생겼다"], type: "JP" },
            { q: "일이나 공부를 시작하기 전에 나는?", a: ["책상을 깨끗이 정리하고 플래너를 작성한 뒤 시작한다", "생각난 김에 바로 책을 펼쳐서 시작한다"], type: "JP" },
            { q: "가고 싶었던 식당이 문을 닫았을 때 나는?", a: ["이미 플랜B로 준비해 둔 근처의 다른 맛집으로 간다", "지나가다 보이는 아무 데나 맘에 드는 곳으로 들어간다"], type: "JP" },
            { q: "나에게 일기장이나 다이어리란?", a: ["주기적으로 일정을 기록하고 체크하는 필수품", "사놓고 몇 장 쓰다가 서랍에 박혀있는 물건"], type: "JP" },
            { q: "예상치 못한 변수가 생겼을 때 더 유연하게 대처하는 편인가?", a: ["변수를 극도로 싫어하며 예측 가능한 상황을 좋아한다", "변수 자체를 즐기거나 상황에 맞춰 즉흥적으로 잘 바꾼다"], type: "JP" }
        ];

        // MBTI 결과 매핑 데이터
        const mbtiResults = {
            "ISTJ": { emoji: "📏", nickname: "청렴결백한 논리주의자", desc: ["매사에 철저하고 규칙을 잘 지킵니다.", "책임감이 강하며 현실적인 문제를 잘 해결합니다.", "변화를 싫어하고 보수적인 경향이 있습니다."] },
            "ISFJ": { emoji: "🛡️", nickname: "용감한 수호자", desc: ["타인을 보호하고 헌신하는 따뜻한 성격입니다.", "기억력이 좋고 주변 사람들을 세심하게 챙깁니다.", "거절을 잘 못 해서 혼자 속앓이를 하기도 합니다."] },
            "INFJ": { emoji: "🔮", nickname: "선의의 옹호자", desc: ["가장 흔하지 않은 유형으로, 깊은 통찰력을 가졌습니다.", "이상주의적이며 자신만의 뚜렷한 가치관이 있습니다.", "겉은 부드러워 보이지만 속은 매우 단단합니다."] },
            "INTJ": { emoji: "🧠", nickname: "용의주도한 전략가", desc: ["논리적이고 분석적이며 지적 호기심이 왕성합니다.", "자신만의 철저한 통제와 계획 아래 움직입니다.", "감정적인 위로보다는 이성적인 조언에 능합니다."] },
            "ISTP": { emoji: "🛠️", nickname: "만능 재주꾼", desc: ["냉철한 이성과 왕성한 호기심을 가진 장인형입니다.", "상황에 대한 적응력이 뛰어나고 위기에 강합니다.", "말수가 적고 혼자만의 효율을 중요시합니다."] },
            "ISFP": { emoji: "🎨", nickname: "호기심 많은 예술가", desc: ["말없이 다정하고 온화하며 사람들에게 친절합니다.", "현재의 삶을 즐기며 예술적인 감각이 뛰어납니다.", "갈등을 회피하려는 성향이 강합니다."] },
            "INFP": { emoji: "🦄", nickname: "열정적인 중재자", desc: ["상상력이 풍부하고 깊은 공감 능력을 지녔습니다.", "자신만의 가치관과 의미를 찾는 데 집중합니다.", "마음이 여려 상처를 쉽게 받기도 합니다."] },
            "INTP": { emoji: "🧪", nickname: "논리적인 사색가", desc: ["비평적인 관점을 가진 뛰어난 전략가입니다.", "문제를 분석하고 본질을 파악하는 것을 즐깁니다.", "관심 없는 분야나 사소한 잡담에는 흥미가 없습니다."] },
            "ESTP": { emoji: "🏍️", nickname: "수완 좋은 활동가", desc: ["스릴을 즐기고 행동력이 매우 뛰어난 유형입니다.", "말보다는 직접 몸으로 부딪히며 배웁니다.", "유머러스하고 에너지가 넘쳐 인기가 많습니다."] },
            "ESFP": { emoji: "🎉", nickname: "자유로운 영혼의 연예인", desc: ["주변에 흥을 돋우는 분위기 메이커입니다.", "사람들과 어울리는 것을 좋아하고 낙천적입니다.", "진지한 대화나 긴 계획 수립은 지루해합니다."] },
            "ENFP": { emoji: "✨", nickname: "재기발랄한 활동가", desc: ["아이디어가 많고 긍정 에너지가 넘칩니다.", "사람들과 깊게 교감하며 리액션이 풍부합니다.", "시작은 잘하지만 마무리가 다소 약할 수 있습니다."] },
            "ENTP": { emoji: "🔥", nickname: "뜨거운 논쟁을 즐기는 변론가", desc: ["지적인 도전을 즐기며 두뇌 회전이 빠릅니다.", "기존의 틀에 박힌 규칙을 깨는 것을 좋아합니다. ", "토론할 때 상대방의 모순을 짚어내길 좋아합니다."] },
            "ESTJ": { emoji: "👔", nickname: "엄격한 관리자", desc: ["조직을 이끌어 나가는 데 천부적인 재능이 있습니다.", "명확한 규칙과 효율성을 중요하게 생각합니다.", "가끔 타인에게 고집스럽거나 엄격하게 보일 수 있습니다."] },
            "ESFJ": { emoji: "🤝", nickname: "사교적인 외교관", desc: ["친절하고 동정심이 많아 주변에 사람이 많습니다.", "타인의 인정을 받거나 칭찬받을 때 행복해합니다.", "조화로운 관계를 방해하는 갈등을 싫어합니다."] },
            "ENFJ": { emoji: "☀️", nickname: "정의로운 사회운동가", desc: ["카리스마와 열정을 지닌 타고난 리더입니다.", "타인의 성장을 돕고 이끄는 데 보람을 느낍니다.", "타인의 감정에 지나치게 감정 이입을 하기도 합니다."] },
            "ENTJ": { emoji: "👑", nickname: "대담한 통솔자", desc: ["장기적인 비전을 제시하고 결단력 있게 행동합니다.", "효율성이 떨어지거나 무능한 상황을 견디지 못합니다.", "목표 성취를 위해 밀어붙이는 리더십이 강합니다."] }
        };

        let currentIdx = 0;
        let scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };

        // 화면 전환 함수
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            
            // 한 페이지 내에서 부드럽게 최상단 스크롤 효과
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 퀴즈 시작
        function startQuiz() {
            currentIdx = 0;
            scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
            showScreen('quiz-screen');
            updateQuestion();
        }

        // 질문 업데이트
        function updateQuestion() {
            if (currentIdx >= questions.length) {
                showResult();
                return;
            }

            const qData = questions[currentIdx];
            document.getElementById('question-count').innerText = `${currentIdx + 1} / ${questions.length}`;
            document.getElementById('question-text').innerText = qData.q;
            
            const btns = document.querySelectorAll('.answer-btn');
            btns[0].innerText = qData.a[0];
            btns[1].innerText = qData.a[1];

            // 프로그레스 바 업데이트
            const percent = ((currentIdx) / questions.length) * 100;
            document.getElementById('progress').style.width = `${percent}%`;
        }

        // 답변 선택 처리
        function selectAnswer(btnIdx) {
            const qData = questions[currentIdx];
            const typeKey = qData.type; // 예: "EI"
            
            // 첫 번째 버튼은 무조건 앞 글자 타입(E, S, T, J), 두 번째 버튼은 뒷 글자 타입(I, N, F, P)
            if (btnIdx === 0) {
                scores[typeKey[0]]++;
            } else {
                scores[typeKey[1]]++;
            }

            currentIdx++;
            updateQuestion();
        }

        // 결과 도출 및 화면 표시
        function showResult() {
            // 프로그레스 바 100% 채우기
            document.getElementById('progress').style.width = `100%`;

            let mbti = "";
            mbti += (scores.E >= scores.I) ? "E" : "I";
            mbti += (scores.S >= scores.N) ? "S" : "N";
            mbti += (scores.T >= scores.F) ? "T" : "F";
            mbti += (scores.J >= scores.P) ? "J" : "P";

            const result = mbtiResults[mbti];

            document.getElementById('mbti-title').innerText = mbti;
            document.getElementById('mbti-emoji').innerText = result.emoji;
            document.getElementById('mbti-nickname').innerText = result.nickname;

            const descUl = document.getElementById('mbti-desc');
            descUl.innerHTML = "";
            result.desc.forEach(d => {
                const li = document.createElement('li');
                li.innerText = d;
                descUl.appendChild(li);
            });

            // 약간의 딜레이를 주어 프로그레스바가 다 차는 것을 보고 결과로 넘어가도록 처리
            setTimeout(() => {
                showScreen('result-screen');
            }, 300);
        }

        // 다시 하기
        function restartQuiz() {
            showScreen('start-screen');
        }
    </script>
</body>
</html>
